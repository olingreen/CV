<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f4f9;
        }
        .pdf-container {
            width: 100%;
            height: 100%;
        }
        .mobile-fallback {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            background-color: #ffffff;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #0070f3;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 15px;
            font-size: 1.1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:hover {
            background-color: #0051a8;
        }
    </style>
</head>
<body>

    <div class="pdf-container">
        <object data="CV.pdf" type="application/pdf" width="100%" height="100%">
            
            <div class="mobile-fallback">
                <p>Your browser doesn't support viewing PDFs directly.</p>
                <a href="CV.pdf" class="btn" target="_blank">View / Download PDF</a>
            </div>
            
        </object>
    </div>

</body>
</html>
